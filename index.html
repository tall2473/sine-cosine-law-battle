<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正弦定理？余弦定理？ 見分けバトル</title><style>
*{box-sizing:border-box}body{margin:0;background:#020617;color:white;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit;cursor:pointer}.app{height:100dvh;max-width:1250px;margin:auto;padding:12px;display:flex;flex-direction:column;background:radial-gradient(circle at top left,#064e3b55,transparent 38%),radial-gradient(circle at bottom right,#164e6355,transparent 38%)}header{height:52px;display:flex;justify-content:space-between;align-items:center}h1{font-size:clamp(22px,3vw,34px);margin:0}.nav{display:flex;gap:7px}.nav button{height:40px;padding:0 15px;border:0;border-radius:12px;background:#ffffff18;font-weight:900}.nav .on.practice{background:#4ade80;color:#0f172a}.nav .on.time{background:#fbbf24;color:#0f172a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:7px 0}.stat{background:#ffffff12;border:1px solid #ffffff1c;border-radius:12px;padding:8px;display:flex;justify-content:space-between}.stat small{color:#94a3b8}.panel{flex:1;min-height:0;background:#ffffff12;border:1px solid #ffffff1c;border-radius:25px;padding:16px;display:grid;place-items:center;overflow:hidden}.game{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.ask{font-size:clamp(30px,4vw,52px);font-weight:950;color:#fcd34d;margin:4px 0}.tri{width:100%;max-height:44vh}.answers{display:grid;gap:12px}.answers button{height:100px;border-radius:18px;border:2px solid;font-size:30px;font-weight:950;background:#ffffff10}.sine{border-color:#34d399!important;background:#10b98122!important}.cosine{border-color:#22d3ee!important;background:#06b6d422!important}.feedback{min-height:105px;margin-top:12px;border-radius:16px;padding:13px}.good{background:#34d39922}.bad{background:#fb718522}.center{text-align:center}.start,.again{border:0;border-radius:16px;background:#fbbf24;color:#0f172a;font-weight:950;font-size:21px;padding:15px 44px}.foot{text-align:center;color:#94a3b8;font-size:12px;padding-top:4px}@media(max-width:760px){.app{height:auto;min-height:100dvh}.game{grid-template-columns:1fr}.panel{overflow:auto}.tri{max-height:none}.answers button{height:75px}}
</style></head><body><div class="app"><header><h1>正弦定理？ <span style="color:#67e8f9">余弦定理？</span></h1><div class="nav"><button id="practice" class="on practice" onclick="reset('practice')">練習</button><button id="time" onclick="reset('time')">60秒</button><button onclick="reset(mode)">↻</button></div></header><div class="stats"><div class="stat"><small>正解</small><b id="correct">0</b></div><div class="stat"><small>連続</small><b id="streak">0</b></div><div class="stat"><small>正答率</small><b id="acc">0%</b></div><div class="stat"><small id="lastLabel">問題</small><b id="last">1</b></div></div><main class="panel" id="panel"></main><div class="foot">Aの対辺=a ｜ Bの対辺=b ｜ Cの対辺=c</div></div><script>
const NONRIGHT=[30,45,60,120,135,150],pick=a=>a[Math.floor(Math.random()*a.length)],r1=x=>Math.round(x*10)/10;let mode='practice',q,feedback=null,correct=0,total=0,streak=0,time=60,running=false,timer;
function makeQ(){if(Math.random()<.5){const triples=[[30,30,120],[30,60,90],[30,90,60],[30,120,30],[45,45,90],[45,90,45],[60,30,90],[60,60,60],[60,90,30],[90,30,60],[90,45,45],[90,60,30],[120,30,30]],t=pick(triples),ang={A:t[0],B:t[1],C:t[2]},k=pick([6,8,10,12]),side=x=>r1(k*Math.sin(x*Math.PI/180)),s={A:side(t[0]),B:side(t[1]),C:side(t[2])},known=pick(['A','B','C']),target=pick(['A','B','C'].filter(x=>x!==known)),findSide=Math.random()<.5;if(findSide)return{t:'sine',ask:'辺 '+target.toLowerCase()+' を求める',A:(known==='A'||target==='A')?ang.A+'°':'?',B:(known==='B'||target==='B')?ang.B+'°':'?',C:(known==='C'||target==='C')?ang.C+'°':'?',a:known==='A'?s.A:'?',b:known==='B'?s.B:'?',c:known==='C'?s.C:'?',why:'角'+known+'と対辺'+known.toLowerCase()+'のペアが分かっているので正弦定理。'};return{t:'sine',ask:'角 '+target+' を求める',A:known==='A'?ang.A+'°':'?',B:known==='B'?ang.B+'°':'?',C:known==='C'?ang.C+'°':'?',a:(known==='A'||target==='A')?s.A:'?',b:(known==='B'||target==='B')?s.B:'?',c:(known==='C'||target==='C')?s.C:'?',why:'角'+known+'と対辺'+known.toLowerCase()+'のペアが分かっているので正弦定理。'}}else{const A=pick(NONRIGHT),b=pick([5,6,7,8,9]),c=pick([6,7,8,9,10]),a=r1(Math.sqrt(b*b+c*c-2*b*c*Math.cos(A*Math.PI/180)));return Math.random()<.5?{t:'cosine',ask:'辺 a を求める',A:A+'°',B:'?',C:'?',a:'?',b,c,why:'2辺b、cとその間の角Aが分かっているので余弦定理。'}:{t:'cosine',ask:'角 A を求める',A:'?',B:'?',C:'?',a,b,c,why:'3辺a、b、cが分かっているので余弦定理。'}}}
function tri(){return `<svg viewBox="0 0 420 290" class="tri"><polygon points="210,28 52,250 368,250" fill="#0f172ab8" stroke="#94a3b8" stroke-width="3"/><text x="184" y="22" fill="white" font-size="18" font-weight="bold">A ${q.A}</text><text x="5" y="274" fill="white" font-size="18" font-weight="bold">B ${q.B}</text><text x="344" y="274" fill="white" font-size="18" font-weight="bold">C ${q.C}</text><text x="188" y="280" fill="#67e8f9" font-size="20" font-weight="bold">a=${q.a}</text><text x="286" y="137" fill="#67e8f9" font-size="20" font-weight="bold">b=${q.b}</text><text x="70" y="137" fill="#67e8f9" font-size="20" font-weight="bold">c=${q.c}</text></svg>`}
function update(){document.getElementById('correct').textContent=correct;document.getElementById('streak').textContent=streak;document.getElementById('acc').textContent=(total?Math.round(correct/total*100):0)+'%';document.getElementById('lastLabel').textContent=mode==='time'?'残り':'問題';document.getElementById('last').textContent=mode==='time'?time+'秒':total+1}
function answer(t){if(feedback||(mode==='time'&&!running))return;feedback={ok:t===q.t};total++;if(feedback.ok){correct++;streak++}else streak=0;update();render();setTimeout(()=>{feedback=null;q=makeQ();render()},feedback.ok?(mode==='time'?350:700):(mode==='time'?1000:1600))}
function reset(m){clearInterval(timer);mode=m;q=makeQ();feedback=null;correct=total=streak=0;time=60;running=false;document.getElementById('practice').className=m==='practice'?'on practice':'';document.getElementById('time').className=m==='time'?'on time':'';update();render()}
function start(){running=true;timer=setInterval(()=>{time--;update();if(time<=0){clearInterval(timer);running=false;render()}},1000);render()}
function render(){update();let p=document.getElementById('panel');if(mode==='time'&&!running&&time===60){p.innerHTML=`<div class="center"><h2>60秒チャレンジ</h2><p>条件を見て、正弦定理か余弦定理かを判断！</p><button class="start" onclick="start()">START!</button></div>`;return}if(mode==='time'&&!running&&time===0){p.innerHTML=`<div class="center"><div style="font-size:60px">🏆</div><h2>TIME UP!</h2><p>正解 <b>${correct}問</b>　正答率 ${total?Math.round(correct/total*100):0}%</p><button class="again" onclick="reset('time')">もう一回！</button></div>`;return}p.innerHTML=`<div class="game"><div><p>この問題なら、どちらの定理？</p><div class="ask">${q.ask}</div>${tri()}</div><div><div class="answers"><button class="sine" onclick="answer('sine')">正弦定理</button><button class="cosine" onclick="answer('cosine')">余弦定理</button></div><div class="feedback ${feedback?(feedback.ok?'good':'bad'):''}">${feedback?`<b>${feedback.ok?'正解！':'惜しい！ 正解は '+(q.t==='sine'?'正弦定理':'余弦定理')}</b><br>${q.why}`:''}</div></div></div>`}
q=makeQ();update();render();</script></body></html>
